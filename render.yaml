services:
  # PHALANX Backend API Service
  - type: web
    name: phalanx-api
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt -r requirements-dev.txt && pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: phalanx-db
          property: connectionString
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: SECRET_KEY
        generateValue: true

  # PHALANX Frontend React UI
  - type: web
    name: phalanx-web
    runtime: static
    region: oregon
    plan: free
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: ./web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: phalanx-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # Managed PostgreSQL Database
  - name: phalanx-db
    plan: free
    region: oregon
    databaseName: phalanx
    user: phalanx_app

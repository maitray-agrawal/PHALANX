# Render deployment manifest for PHALANX
# Runtime: Docker (builds from Dockerfile in repo root)
# Plan: free
#
# autoDeploy: false — the CI workflow's deploy job calls RENDER_DEPLOY_HOOK on
# every green push to main. Using both autoDeploy and the hook would trigger
# two deployments per push; autoDeploy: false avoids that conflict.
#
# healthCheckPath: /healthz — liveness probe only; never touches the database.
# /readyz is the DB-checking readiness probe (not used by Render health check).
#
# All secrets have sync: false. Set them manually in the Render Environment UI.
# Never commit secret values to this file.

services:
  - type: web
    name: phalanx
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Region: set to match Neon database region (oregon for AWS us-west-2, or ohio for AWS us-east-2)
    region: oregon
    plan: free
    branch: main
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      # ---- Secrets: set manually in Render dashboard (sync: false) ----------
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: MANDATE_SIGNING_KEY_HEX
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RECONCILE_SECRET
        sync: false
      # DATABASE_URL must include ?sslmode=require for Neon (see docs/evidence/neon-manual-setup.md)
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # ---- Non-secret configuration -----------------------------------------
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "10000"
      - key: ENVIRONMENT
        value: demo
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_SEED
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: PAYMENT_RAIL
        value: paypal
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: RECONCILER_ENABLED
        value: "false"
      # Proxy chain: Client -> Cloudflare -> Render proxy -> app container.
      # Render proxy is the TCP peer (request.client.host).
      # Render appends Cloudflare IP as the rightmost entry in XFF (ips[-1]).
      # Cloudflare appends the real Client IP at ips[-2].
      # With extract_client_ip selecting ips[-1 - TRUSTED_PROXY_COUNT],
      # TRUSTED_PROXY_COUNT=1 selects ips[-2] (the real Client IP).
      # Status: UNVERIFIED until confirmed live via GET /v1/admin/client-ip.
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_DAILY_CALL_CAP
        value: "300"
      - key: ALLOWED_HOSTS
        value: "*"

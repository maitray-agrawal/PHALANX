# Render Blueprint configuration for PHALANX
# Purpose: Authorization & Governance layer for Autonomous Financial Agents (PayPal AI Hackathon 2026)
# Database Plan: Starter (persists through evaluation & judging through 15 Dec 2026; free tier expires after 30 days)

services:
  - type: web
    name: phalanx-governance
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    branch: main
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: PAYMENT_RAIL
        value: paypal
      - key: DATABASE_URL
        fromDatabase:
          name: phalanx-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: ALLOWED_HOSTS
        value: "phalanx-governance.onrender.com,localhost,127.0.0.1"

databases:
  - name: phalanx-postgres
    databaseName: phalanx_db
    user: phalanx_app
    region: oregon
    plan: starter

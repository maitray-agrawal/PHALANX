# Render Blueprint configuration for PHALANX
# Purpose: Authorization & Governance layer for Autonomous Financial Agents (PayPal AI Hackathon 2026)
# Database & Web Service Plan: Starter (persists through evaluation & judging through 15 Dec 2026)

services:
  - type: web
    name: phalanx-governance
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: "pip install uv && uv sync && cd web && npm ci && npm run build"
    startCommand: "uv run python scripts/boot.py && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: phalanx-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_HOSTS
        value: "phalanx-governance.onrender.com,localhost,127.0.0.1"

databases:
  - name: phalanx-postgres
    databaseName: phalanx_db
    user: phalanx_app
    region: oregon
    plan: starter

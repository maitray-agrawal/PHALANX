name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  backend-checks:
    name: Backend Lint, Types & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install backend dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Lint (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Static Type Check (Mypy)
        run: |
          mypy app

      - name: Run Test Suite
        run: |
          pytest -q

      - name: Run Red Team Adversarial Tests
        run: |
          pytest -q -m redteam

  frontend-checks:
    name: Frontend Lint, Types & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Lint
        working-directory: ./web
        run: npm run lint

      - name: Typecheck
        working-directory: ./web
        run: npx tsc --noEmit

      - name: Tests
        working-directory: ./web
        run: npm test -- --run

      - name: Build
        working-directory: ./web
        run: npm run build

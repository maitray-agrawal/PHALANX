name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  backend-checks:
    name: Backend Lint, Types & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install backend dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Lint (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Static Type Check (Mypy)
        run: |
          mypy app

      - name: Run Test Suite
        run: |
          pytest -q

      - name: Run Red Team Adversarial Tests
        run: |
          pytest -q -m redteam

  frontend-checks:
    name: Frontend Lint, Types & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Lint
        working-directory: ./web
        run: npm run lint

      - name: Typecheck
        working-directory: ./web
        run: npx tsc --noEmit

      - name: Tests
        working-directory: ./web
        run: npm test -- --run

      - name: Build
        working-directory: ./web
        run: npm run build

  deploy:
    name: Trigger Render Deployment
    needs: [backend-checks, frontend-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Triggering Render deployment from main on green CI..."
            curl -f -X POST "$RENDER_DEPLOY_HOOK"
            echo "Render deploy hook triggered successfully."
          else
            echo "RENDER_DEPLOY_HOOK secret not configured; skipping automatic deploy trigger."
          fi

      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post-Deploy Smoke Test
        env:
          PHALANX_TARGET_URL: ${{ secrets.PHALANX_TARGET_URL }}
          PHALANX_ADMIN_TOKEN: ${{ secrets.PHALANX_ADMIN_TOKEN }}
        run: |
          if [ -n "$PHALANX_TARGET_URL" ]; then
            echo "Waiting 45s for Render service to finish rollout..."
            sleep 45
            python scripts/post_deploy_smoke.py --url "$PHALANX_TARGET_URL" --admin-token "${PHALANX_ADMIN_TOKEN:-phalanx-admin-demo-key}"
          else
            echo "PHALANX_TARGET_URL not configured; skipping remote smoke test."
          fi

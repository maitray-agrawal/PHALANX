<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A14"/>
      <stop offset="40%" stop-color="#0A1124"/>
      <stop offset="100%" stop-color="#04070E"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/>
    </linearGradient>
    <linearGradient id="allow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="stepup-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="deny-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-shield" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Pattern Grid -->
    <pattern id="grid-pattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .title { font-weight: 900; letter-spacing: -2px; }
    .tagline { font-weight: 500; letter-spacing: 0.5px; }
    .badge { font-weight: 700; letter-spacing: 1px; }
  </style>

  <!-- Background Layer -->
  <rect width="1920" height="1080" fill="url(#bg-grad)"/>
  <rect width="1920" height="1080" fill="url(#grid-pattern)"/>

  <!-- Subtle Cybernetic Glow Orbs -->
  <circle cx="250" cy="200" r="300" fill="#00F2FE" opacity="0.08" filter="url(#glow-shield)"/>
  <circle cx="1600" cy="500" r="380" fill="#6366F1" opacity="0.1" filter="url(#glow-shield)"/>
  <circle cx="960" cy="950" r="450" fill="#10B981" opacity="0.05" filter="url(#glow-shield)"/>

  <!-- Left Header & Branding Area -->
  <g transform="translate(100, 100)">
    <!-- Hackathon Track Pill -->
    <rect x="0" y="0" width="460" height="42" rx="21" fill="rgba(99, 102, 241, 0.15)" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="22" cy="21" r="7" fill="#6366F1"/>
    <text x="42" y="27" fill="#A5B4FC" class="font-sans badge" font-size="16">PAYPAL AI HACKATHON 2026 ENTRY</text>

    <!-- Main Title with Glowing Accent -->
    <text x="0" y="160" fill="#FFFFFF" class="font-sans title" font-size="108">PHALANX</text>
    <text x="560" y="160" fill="#00F2FE" class="font-sans title" font-size="108" filter="url(#glow-cyan)">.</text>

    <!-- Subtitle / Positioning Statement -->
    <text x="0" y="225" fill="#E2E8F0" class="font-sans" font-size="34" font-weight="700">
      Autonomous Financial Agent Governance &amp; Payment Security
    </text>

    <!-- Tagline -->
    <text x="0" y="275" fill="#94A3B8" class="font-sans tagline" font-size="24">
      Let agents act. Keep humans and policy in control.
    </text>

    <!-- Core Architecture Pill Badges -->
    <g transform="translate(0, 340)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="370" height="54" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="#334155" stroke-width="1.5"/>
      <circle cx="28" cy="27" r="8" fill="#00F2FE"/>
      <text x="50" y="34" fill="#F8FAFC" class="font-mono" font-size="17" font-weight="600">0ms I/O Pure Policy Core</text>

      <!-- Pill 2 -->
      <rect x="390" y="0" width="370" height="54" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="#334155" stroke-width="1.5"/>
      <circle cx="418" cy="27" r="8" fill="#8B5CF6"/>
      <text x="440" y="34" fill="#F8FAFC" class="font-mono" font-size="17" font-weight="600">Ed25519 Signed Mandates</text>

      <!-- Pill 3 -->
      <rect x="0" y="70" width="370" height="54" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="#334155" stroke-width="1.5"/>
      <circle cx="28" cy="97" r="8" fill="#10B981"/>
      <text x="50" y="104" fill="#F8FAFC" class="font-mono" font-size="17" font-weight="600">PostgreSQL Append Triggers</text>

      <!-- Pill 4 -->
      <rect x="390" y="70" width="370" height="54" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="#334155" stroke-width="1.5"/>
      <circle cx="418" cy="97" r="8" fill="#0079C1"/>
      <text x="440" y="104" fill="#F8FAFC" class="font-mono" font-size="17" font-weight="600">PayPal Sandbox Orders v2</text>
    </g>

    <!-- Key Metrics Highlight Strip -->
    <g transform="translate(0, 520)">
      <rect x="0" y="0" width="760" height="150" rx="16" fill="url(#card-grad)" stroke="#1E293B" stroke-width="1.5"/>
      
      <!-- Metric 1 -->
      <g transform="translate(45, 38)">
        <text x="0" y="32" fill="#10B981" class="font-mono" font-size="44" font-weight="800">$0.00</text>
        <text x="0" y="68" fill="#94A3B8" class="font-sans" font-size="16" font-weight="600">Financial Leakage</text>
      </g>
      
      <!-- Divider -->
      <line x1="280" y1="25" x2="280" y2="125" stroke="#334155" stroke-width="1.5"/>

      <!-- Metric 2 -->
      <g transform="translate(325, 38)">
        <text x="0" y="32" fill="#00F2FE" class="font-mono" font-size="44" font-weight="800">0.4ms</text>
        <text x="0" y="68" fill="#94A3B8" class="font-sans" font-size="16" font-weight="600">Policy Evaluation</text>
      </g>

      <!-- Divider -->
      <line x1="520" y1="25" x2="520" y2="125" stroke="#334155" stroke-width="1.5"/>

      <!-- Metric 3 -->
      <g transform="translate(565, 38)">
        <text x="0" y="32" fill="#A5B4FC" class="font-mono" font-size="44" font-weight="800">100%</text>
        <text x="0" y="68" fill="#94A3B8" class="font-sans" font-size="16" font-weight="600">Cryptographic Audit</text>
      </g>
    </g>
  </g>

  <!-- Right Visual Area: Live Interactive Architecture & Decision Showcase -->
  <g transform="translate(980, 100)">
    <!-- Container Card -->
    <rect x="0" y="0" width="840" height="880" rx="24" fill="rgba(10, 17, 36, 0.9)" stroke="#1E293B" stroke-width="2"/>

    <!-- Window Header -->
    <rect x="0" y="0" width="840" height="60" rx="24" fill="#0F172A"/>
    <!-- Fake window buttons -->
    <circle cx="35" cy="30" r="7" fill="#EF4444"/>
    <circle cx="60" cy="30" r="7" fill="#F59E0B"/>
    <circle cx="85" cy="30" r="7" fill="#10B981"/>
    <text x="420" y="36" fill="#94A3B8" class="font-mono" font-size="16" text-anchor="middle">phalanx-authorization-engine // runtime telemetry</text>

    <!-- Visual 3-State Firewall Decision Tree -->
    <g transform="translate(40, 95)">
      <!-- Card 1: ALLOW -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="760" height="125" rx="14" fill="rgba(16, 185, 129, 0.08)" stroke="#10B981" stroke-width="1.5"/>
        <rect x="25" y="25" width="105" height="34" rx="8" fill="url(#allow-grad)"/>
        <text x="77" y="48" fill="#FFFFFF" class="font-sans badge" font-size="16" text-anchor="middle">ALLOW</text>
        <text x="150" y="49" fill="#F8FAFC" class="font-mono" font-size="20" font-weight="700">AWS Cloud Hosting ($25.00)</text>
        <text x="150" y="80" fill="#94A3B8" class="font-mono" font-size="14">Auto-settled via PayPal Sandbox | Mandate budget reserved: -$25.00</text>
        <circle cx="715" cy="62" r="18" fill="rgba(16, 185, 129, 0.2)"/>
        <path d="M 707 62 L 713 68 L 724 57" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- Card 2: STEP_UP -->
      <g transform="translate(0, 150)">
        <rect x="0" y="0" width="760" height="125" rx="14" fill="rgba(245, 158, 11, 0.08)" stroke="#F59E0B" stroke-width="1.5"/>
        <rect x="25" y="25" width="105" height="34" rx="8" fill="url(#stepup-grad)"/>
        <text x="77" y="48" fill="#FFFFFF" class="font-sans badge" font-size="15" text-anchor="middle">STEP_UP</text>
        <text x="150" y="49" fill="#F8FAFC" class="font-mono" font-size="20" font-weight="700">GPU License ($1,200.00)</text>
        <text x="150" y="80" fill="#94A3B8" class="font-mono" font-size="14">Exceeds $500 auto-approval limit | Escalated to human supervisor</text>
        <circle cx="715" cy="62" r="18" fill="rgba(245, 158, 11, 0.2)"/>
        <path d="M 715 52 L 715 65 M 715 71 L 715 73" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- Card 3: DENY -->
      <g transform="translate(0, 300)">
        <rect x="0" y="0" width="760" height="125" rx="14" fill="rgba(239, 68, 68, 0.08)" stroke="#EF4444" stroke-width="1.5"/>
        <rect x="25" y="25" width="105" height="34" rx="8" fill="url(#deny-grad)"/>
        <text x="77" y="48" fill="#FFFFFF" class="font-sans badge" font-size="16" text-anchor="middle">DENY</text>
        <text x="150" y="49" fill="#F8FAFC" class="font-mono" font-size="20" font-weight="700">Prompt Injection ($9,999.00)</text>
        <text x="150" y="80" fill="#94A3B8" class="font-mono" font-size="14">Unapproved offshore vendor + unparseable tax ID | Blocked instantly</text>
        <circle cx="715" cy="62" r="18" fill="rgba(239, 68, 68, 0.2)"/>
        <path d="M 708 55 L 722 69 M 722 55 L 708 69" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Cryptographic Ledger Hash-Chain Visual Strip -->
    <g transform="translate(40, 560)">
      <rect x="0" y="0" width="760" height="165" rx="14" fill="#020617" stroke="#334155" stroke-width="1.5"/>
      <text x="25" y="35" fill="#00F2FE" class="font-mono" font-size="15" font-weight="700">IMMUTABLE SHA-256 HASH-CHAIN VERIFICATION</text>
      
      <!-- Block 1 -->
      <g transform="translate(25, 55)">
        <rect x="0" y="0" width="215" height="85" rx="8" fill="#0F172A" stroke="#1E293B"/>
        <text x="15" y="25" fill="#94A3B8" class="font-mono" font-size="12">EVENT #1042</text>
        <text x="15" y="48" fill="#38BDF8" class="font-mono" font-size="13">hash: 9a4f..88c1</text>
        <text x="15" y="70" fill="#10B981" class="font-mono" font-size="12">✓ Verified in PG</text>
      </g>

      <path d="M 252 97 L 275 97" stroke="#64748B" stroke-width="2" stroke-dasharray="4,4"/>

      <!-- Block 2 -->
      <g transform="translate(285, 55)">
        <rect x="0" y="0" width="215" height="85" rx="8" fill="#0F172A" stroke="#00F2FE"/>
        <text x="15" y="25" fill="#94A3B8" class="font-mono" font-size="12">EVENT #1043</text>
        <text x="15" y="48" fill="#38BDF8" class="font-mono" font-size="13">hash: 4e7b..219a</text>
        <text x="15" y="70" fill="#10B981" class="font-mono" font-size="12">✓ Prev Hash Linked</text>
      </g>

      <path d="M 512 97 L 535 97" stroke="#64748B" stroke-width="2" stroke-dasharray="4,4"/>

      <!-- Block 3 -->
      <g transform="translate(545, 55)">
        <rect x="0" y="0" width="190" height="85" rx="8" fill="#0F172A" stroke="#1E293B"/>
        <text x="15" y="25" fill="#94A3B8" class="font-mono" font-size="12">TRIGGER GUARD</text>
        <text x="15" y="48" fill="#F43F5E" class="font-mono" font-size="13">UPDATE/DELETE</text>
        <text x="15" y="70" fill="#EF4444" class="font-mono" font-size="12">🚫 BLOCKED</text>
      </g>
    </g>

    <!-- Bottom PayPal Sandbox Integration Bar -->
    <g transform="translate(40, 750)">
      <rect x="0" y="0" width="760" height="90" rx="14" fill="rgba(0, 121, 193, 0.1)" stroke="#0079C1" stroke-width="1.5"/>
      <g transform="translate(30, 28)">
        <!-- Stylized PayPal P icon -->
        <text x="0" y="32" fill="#0079C1" class="font-sans" font-size="36" font-weight="900">P</text>
        <text x="18" y="36" fill="#00457C" class="font-sans" font-size="36" font-weight="900">P</text>
      </g>
      <text x="90" y="42" fill="#F8FAFC" class="font-sans" font-size="18" font-weight="700">PayPal Sandbox Real Two-Phase Capture Enabled</text>
      <text x="90" y="66" fill="#94A3B8" class="font-mono" font-size="13">Orders v2 | AUTHORIZE -> CAPTURE | Complete idempotency with header payload matching</text>
    </g>
  </g>

  <!-- Bottom Global Footer -->
  <g transform="translate(100, 1010)">
    <text x="0" y="0" fill="#64748B" class="font-mono" font-size="15">
      BUILT WITH GOOGLE ANTIGRAVITY &amp; GEMINI 2.5 FLASH • POSTGRESQL ON NEON • FASTAPI • REACT 19
    </text>
    <text x="1720" y="0" fill="#64748B" class="font-mono" font-size="15" text-anchor="end">
      github.com/maitray-agrawal/PHALANX
    </text>
  </g>
</svg>


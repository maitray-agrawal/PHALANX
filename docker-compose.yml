services:
  db:
    image: postgres:16-alpine
    container_name: phalanx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: phalanx_app
      POSTGRES_PASSWORD: Maitray@7979
      POSTGRES_DB: phalanx_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phalanx_app -d phalanx_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phalanx-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+psycopg://phalanx_app:Maitray%407979@db:5432/phalanx_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:

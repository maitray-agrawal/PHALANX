services:
  db:
    image: postgres:16-alpine
    container_name: phalanx-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: phalanx_admin
      POSTGRES_PASSWORD: phalanx_dev_password
      POSTGRES_DB: phalanx_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phalanx_admin -d phalanx_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
